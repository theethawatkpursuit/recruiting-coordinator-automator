<!-- HTML5 document declaration and language set to English -->
<!DOCTYPE html>
<html lang="en">
<!-- Head section: metadata, viewport for responsive design, title, and stylesheet link -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecruitFlow — Reports</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar Navigation: empty container populated by buildSidebar() in js/sidebar.js -->
  <nav class="sidebar"></nav>

  <!-- Main content area for the reports page -->
  <main class="content">
    <!-- Page header with title and description -->
    <header class="page-header">
      <h1>Reports</h1>
      <p>Which hiring sources produce hires vs. first-round drop-offs</p>
    </header>

    <!-- Report stat cards: summary metrics filled in by the top-level script in js/reports.js -->
    <section class="stats-grid" id="reportStats"></section>

    <!-- Source Effectiveness panel: table comparing hiring sources, populated by renderSourceTable() in js/reports.js -->
    <section class="panel">
      <h2>Source Effectiveness</h2>
      <table class="data-table" id="sourceTable">
        <thead>
          <tr>
            <th>Source</th>
            <th>Candidates</th>
            <th>Hires</th>
            <th>First-Round Drop-Off</th>
            <th>Avg. Engagement</th>
            <th>Turnover Rate</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <!-- Export buttons: trigger CSV downloads of the candidate report and source effectiveness report -->
      <div class="report-actions" style="flex-direction: column;">
        <button class="btn-primary" onclick="exportCandidatesCSV()">Export Candidate Report</button>
        <button class="btn-secondary" style="width: 100%;" onclick="exportSourceEffectivenessCSV()">Export Source Effectiveness Report</button>
      </div>
    </section>
  </main>

  <!-- Scripts: load shared data, raw HR dataset, HR data parser, reports logic, set active page, then build sidebar -->
  <script src="js/data.js"></script>
  <script src="js/hr-dataset-raw.js"></script>
  <script src="js/hr-data.js"></script>
  <script src="js/reports.js"></script>
  <script>var ACTIVE_PAGE = "reports.html";</script>
  <script src="js/sidebar.js"></script>
</body>
</html>
