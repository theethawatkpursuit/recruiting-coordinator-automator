<!-- HTML5 document declaration and language set to English -->
<!DOCTYPE html>
<html lang="en">
<!-- Head section: metadata, viewport for responsive design, title, and stylesheet link -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecruitFlow — All Candidates</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sidebar Navigation: empty container populated by buildSidebar() in js/sidebar.js -->
  <nav class="sidebar"></nav>

  <!-- Main content area for the all candidates page -->
  <main class="content">
    <!-- Page header with title and description -->
    <header class="page-header">
      <h1>All Candidates</h1>
      <p>Click any candidate to see their full profile</p>
    </header>

    <!-- Filter bar: dropdowns to narrow candidates by position, department, source, stage, and status.
         Options are populated dynamically by js/candidates-list.js. -->
    <div class="filters" id="candidateFilters">
      <select id="filterPosition"><option value="">All Positions</option></select>
      <select id="filterDepartment"><option value="">All Departments</option></select>
      <select id="filterSource"><option value="">All Sources</option></select>
      <select id="filterStage"><option value="">All Stages</option></select>
      <select id="filterStatus"><option value="">All Statuses</option></select>
      <button type="button" class="btn-secondary btn-small" id="clearFilters">Clear</button>
    </div>

    <!-- Candidate list container: filled with clickable rows by the top-level script in js/candidates-list.js -->
    <div class="candidate-list-box" id="candidateList"></div>
  </main>

  <!-- Scripts: shared data must load before the list logic, then set active page and build sidebar -->
  <script src="js/data.js"></script>
  <script src="js/candidates-list.js"></script>
  <script>var ACTIVE_PAGE = "candidates-list.html";</script>
  <script src="js/sidebar.js"></script>
</body>
</html>
